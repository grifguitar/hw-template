keyset=_gauss_int32
data.size=_1e5

train.seed=42
# Omit to get the rate that fits the selected train.loss — they need rates two orders
# of magnitude apart, see LossFunction for the measurements.
#train.learning.rate=0.05
train.batch.size=32
train.epochs=100
net.hidden.layers=4,4
plot.path=plot.pdf

workload.distribution=_uniform
workload.permutation=_false
workload.factor=_read_only
max.err=_0

# _relu | _leaky_relu | _sigmoid | _tanh | _softsign
net.activation=_relu

# _squared | _absolute | _huber | _log_cosh | _power
# Targets are normalised to [0, 1], so residuals stay below 1 and the losses produce
# gradients of very different magnitude for the same residual (|e| for _squared, a
# constant 1 for _absolute). Retune train.learning.rate when switching.
train.loss=_squared

# Meaning depends on train.loss: transition width for _huber and _log_cosh (must be
# well below 1 or they collapse into _squared), exponent p >= 1 for _power, ignored by
# _squared and _absolute. Omit it to get the default that fits the selected loss.
#train.loss.parameter=0.02
